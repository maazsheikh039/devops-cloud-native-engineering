apiVersion: v1
kind: Service
metadata:
  name: ledger
  namespace: data
spec:
  clusterIP: None
  selector:
    app: ledger
  ports:
    - name: tcp
      port: 7000
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ledger
  namespace: data
spec:
  serviceName: ledger
  replicas: 2
  selector:
    matchLabels:
      app: ledger
  template:
    metadata:
      labels:
        app: ledger
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: disktype
                    operator: In
                    values: ["ssd"]
      containers:
        - name: ledger
          image: busybox:1.36
          command: ["sh", "-c", "echo \"$(date -u) start pod $(hostname) node=$NODE_NAME\" >> /data/history.log; exec sleep 86400"]
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          volumeMounts:
            - name: ledger-data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: ledger-data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: standard
        resources:
          requests:
            storage: 100Mi
