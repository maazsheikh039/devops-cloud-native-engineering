apiVersion: v1
kind: Service
metadata:
  name: demo
  namespace: shop
spec:
  type: ClusterIP
  selector:
    app: demo
    tier: backend
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: demo-nodeport
  namespace: shop
spec:
  type: NodePort
  selector:
    app: demo
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080
