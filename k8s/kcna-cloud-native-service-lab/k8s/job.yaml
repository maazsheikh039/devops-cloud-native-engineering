apiVersion: batch/v1
kind: Job
metadata:
  name: batch-report
  namespace: data
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      nodeSelector:
        disktype: hdd
      tolerations:
        - key: dedicated
          operator: Equal
          value: batch
          effect: NoSchedule
      containers:
        - name: report
          image: busybox:1.36
          command: ["sh", "-c", "echo report generated on $NODE_NAME at $(date -u); sleep 5"]
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
