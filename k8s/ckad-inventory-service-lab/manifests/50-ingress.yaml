apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: inventory-headers
  namespace: shop
spec:
  headers:
    customResponseHeaders:
      X-Served-By: inventory-platform
    contentTypeNosniff: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: inventory
  namespace: shop
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: shop-inventory-headers@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: inventory.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: inventory-api
                port:
                  number: 80
