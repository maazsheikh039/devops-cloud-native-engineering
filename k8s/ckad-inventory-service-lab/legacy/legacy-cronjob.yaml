apiVersion: batch/v1
kind: CronJob
metadata:
  name: legacy-report
  namespace: shop
spec:
  schedule: "0 3 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: report
              image: curlimages/curl:8.10.1
              command: ["curl", "-s", "http://inventory-api/items"]
